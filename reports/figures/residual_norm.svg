   <g id="text_4">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', 'Computer Modern Typewriter', 'Andale Mono', 'Nimbus Mono L', 'Courier New', 'Courier', 'Fixed', 'Terminal', monospace; text-anchor: middle; fill: #52514e" x="416.771669" y="76.713853" transform="rotate(-0 416.771669 76.713853)">x ← x + Sublayer(LayerNorm(x))</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #2a78d6" transform="translate(270.696089 186.68354)">un-normalised</text>
    <text style="font-size: 7px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #2a78d6" transform="translate(261.587339 196.649571)">residual highway</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.3px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(12.581993 262.871147)">In post-LN every residual addition passes through a normalisation on its way to the next layer, so the gradient reaching</text>
    <text style="font-size: 7.3px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(12.581993 274.373665)">layer 1 is attenuated once per layer above it — which is why post-LN needs a long, carefully tuned warmup to avoid diverging.</text>
    <text style="font-size: 7.3px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(12.581993 285.876184)">In pre-LN the residual path runs from input to output untouched, gradients arrive undamped, and training is stable at higher</text>
    <text style="font-size: 7.3px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(12.581993 297.378703)">learning rates with a shorter warmup. That is why this project uses it: a Colab run that diverges at step 300 is an hour lost.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 600; font-size: 11.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #0b0b0b" x="3.6" y="12.338203" transform="rotate(-0 3.6 12.338203)">Where to put the layer normalisation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #0b0b0b" x="129.347899" y="271.470921" transform="rotate(-0 129.347899 271.470921)">x</text>
