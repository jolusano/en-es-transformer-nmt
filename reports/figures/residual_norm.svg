   <g id="text_4">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', 'Computer Modern Typewriter', 'Andale Mono', 'Nimbus Mono L', 'Courier New', 'Courier', 'Fixed', 'Terminal', monospace; text-anchor: middle; fill: #52514e" x="416.771669" y="76.287401" transform="rotate(-0 416.771669 76.287401)">x ← x + Sublayer(LayerNorm(x))</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #2a78d6" transform="translate(275.967964 186.60354)">un-normalised</text>
    <text style="font-size: 7px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #2a78d6" transform="translate(268.719683 195.980259)">residual highway</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.3px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(12.581993 264.210644)">In post-LN every residual addition passes through a normalisation on its way to the next layer, so the gradient reaching</text>
    <text style="font-size: 7.3px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(12.581993 275.224291)">layer 1 is attenuated once per layer above it — which is why post-LN needs a long, carefully tuned warmup to avoid diverging.</text>
    <text style="font-size: 7.3px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(12.581993 286.237938)">In pre-LN the residual path runs from input to output untouched, gradients arrive undamped, and training is stable at higher</text>
    <text style="font-size: 7.3px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(12.581993 297.368613)">learning rates with a shorter warmup. That is why this project uses it: a Colab run that diverges at step 300 is an hour lost.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 600; font-size: 11.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #0b0b0b" x="3.6" y="11.811719" transform="rotate(-0 3.6 11.811719)">Where to put the layer normalisation</text>
   </g>
   <g id="text_8">
