   <g id="text_4">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans Mono', 'Bitstream Vera Sans Mono', 'Computer Modern Typewriter', 'Andale Mono', 'Nimbus Mono L', 'Courier New', 'Courier', 'Fixed', 'Terminal', monospace; text-anchor: middle; fill: #52514e" x="416.771669" y="70.51698" transform="rotate(-0 416.771669 70.51698)">x ← x + Sublayer(LayerNorm(x))</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #2a78d6" transform="translate(275.967964 168.381159)">un-normalised</text>
    <text style="font-size: 7px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #2a78d6" transform="translate(268.719683 177.757878)">residual highway</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.3px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(109.981487 288.607303)">In post-LN every residual addition passes through a normalisation on its way to the next layer, so the gradient reaching</text>
    <text style="font-size: 7.3px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(97.656463 300.148032)">layer 1 is attenuated once per layer above it — which is why post-LN needs a long, carefully tuned warmup to avoid diverging.</text>
    <text style="font-size: 7.3px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(102.384354 311.688762)">In pre-LN the residual path runs from input to output untouched, gradients arrive undamped, and training is stable at higher</text>
    <text style="font-size: 7.3px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #52514e" transform="translate(104.755713 323.353021)">learning rates with a shorter warmup. That is why this project uses it: a Colab run that diverges at step 300 is an hour lost.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 600; font-size: 11.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #0b0b0b" x="3.6" y="11.811719" transform="rotate(-0 3.6 11.811719)">Where to put the layer normalisation</text>
   </g>
   <g id="text_8">
