[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nmt"
version = "1.0.0"
description = "Bidirectional English-Spanish neural machine translation with a transformer built from primitives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jose Luis Sanchez Noriega" },
    { name = "Bikash Subedi" },
]
keywords = ["nlp", "machine-translation", "transformer", "pytorch", "seneca", "aig230"]

dependencies = [
    "torch>=2.2",
    "sentencepiece>=0.2.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "sacrebleu>=2.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
app = ["gradio>=4.44"]
dev = ["pytest>=8.0", "ruff>=0.5", "jupyter>=1.0", "nbstripout>=0.7"]

[project.scripts]
nmt-build-data = "nmt.data.build:main"
nmt-train = "nmt.training.train:main"
nmt-evaluate = "nmt.evaluation.evaluate:main"
nmt-figures = "nmt.viz.make_figures:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 92
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# PEP 8 compliance is part of the rubric; these are the rule families that
# enforce it, plus import ordering and a few common correctness traps.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B905",   # zip(..., strict=) is 3.10+, but the meaning here is always "shortest"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"app/*" = ["E402"]        # sys.path manipulation must precede the imports
# Notebooks are written for reading, not for import hygiene: imports appear in
# the cell that first needs them, and the shared bootstrap cell brings in names
# that only some notebooks go on to use.
"notebooks/*" = ["E402", "I001", "F401", "E501"]
"*.ipynb" = ["E402", "I001", "F401", "E501"]
