name: smoke
description: Two-layer, 128-wide model on 2,000 pairs. Pipeline check only.
model:
  architecture: transformer
  vocab_size: 16000
  d_model: 128
  num_heads: 4
  d_ff: 256
  num_encoder_layers: 2
  num_decoder_layers: 2
  dropout: 0.1
  attention_dropout: 0.1
  activation: relu
  positional_encoding: sinusoidal
  max_position: 512
  norm_first: true
  tie_embeddings: true
  embedding_dim: null
  pretrained_embeddings: null
  freeze_embeddings_epochs: 0
  lstm_hidden_size: 512
  lstm_num_layers: 2
data:
  processed_dir: /content/en-es-transformer-nmt/data/processed
  tokenizer: /content/en-es-transformer-nmt/artifacts/tokenizers/joint_bpe.model
  max_length: 64
  max_tokens_per_batch: 2048
  eval_batch_size: 32
  num_workers: 0
  limit_train_pairs: 2000
optim:
  optimizer: adamw
  learning_rate: 1.0
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-09
  scheduler: inverse_sqrt
  warmup_steps: 100
  label_smoothing: 0.1
  max_grad_norm: 1.0
  gradient_accumulation_steps: 1
train:
  epochs: 2
  seed: 42
  device: auto
  amp: false
  log_every: 20
  evals_per_epoch: 1
  early_stopping_patience: 10
  keep_last_checkpoints: 2
  validation_bleu_samples: 50
  checkpoint_dir: /content/en-es-transformer-nmt/artifacts/checkpoints/smoke
  results_dir: /content/en-es-transformer-nmt/artifacts/results/smoke
